spring:
  application:
    name: makemycrip-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/makemycrip}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: makemycrip-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.makemycrip.*"

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:support@makemycrip.com}
    password: ${MAIL_PASSWORD:yjqxrsrsg}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:2532777-bue761a367vpam.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET:GOPX-tDUljlWnNZINW1d}
            scope: email, profile

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    encoding: UTF-8

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /
  error:
    whitelabel:
      enabled: false

app:
  kafka:
    enabled: false   # Set to true when Kafka broker is running
  jwt:
    secret: ${JWT_SECRET:makemycripSecretKey2024MakeMyCripSecretKey2024MakeMyCripSecretKey2024}
    access-expiration-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRY_MS:2592000000}
  encryption:
    key: ${ENCRYPTION_KEY:base64EncodedAES256KeyHere3232323232}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_J1DHOQCJ040WOk3o3f}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_0df969fc49bc0c6212a3}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_5eIwAAO86jUNBnGGl9RI}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
    db:
      enabled: true

logging:
  pattern:
    console: "[%d{yyyy-MM-dd HH:mm:ss}] [%thread] [%X{correlationId}] [%-5level] %logger{36} - %msg%n"
  level:
    root: INFO
    com.makemycrip: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.apache.kafka: ERROR
    org.springframework.kafka: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
