<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Verify Your Email</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    .wrapper { max-width: 600px; margin: 30px auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .header { background: linear-gradient(135deg, #1a73e8, #0d47a1); padding: 32px 24px; text-align: center; }
    .header h1 { color: #fff; margin: 0; font-size: 24px; }
    .body { padding: 32px 24px; text-align: center; }
    .otp-box { background: #f0f4ff; border: 2px dashed #1a73e8; border-radius: 12px; padding: 24px; margin: 24px auto; max-width: 280px; }
    .otp-code { font-size: 36px; font-weight: 700; letter-spacing: 10px; color: #1a73e8; }
    .otp-note { font-size: 13px; color: #666; margin-top: 8px; }
    .footer { background: #f8f8f8; padding: 20px 24px; text-align: center; font-size: 12px; color: #999; }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1>&#9993; Verify Your Email</h1>
  </div>
  <div class="body">
    <p>Hi <strong th:text="${name}">there</strong>,</p>
    <p>Please use the OTP below to verify your MakeMyCrip email address:</p>
    <div class="otp-box">
      <div class="otp-code" th:text="${otp}">123456</div>
      <div class="otp-note">Valid for <strong th:text="${expiryMinutes}">10</strong> minutes</div>
    </div>
    <p style="font-size:13px;color:#888;">If you didn't create a MakeMyCrip account, you can safely ignore this email.</p>
    <p style="font-size:13px;color:#e53935;font-weight:600;">Never share this OTP with anyone.</p>
  </div>
  <div class="footer">&copy; 2025 MakeMyCrip. All rights reserved.</div>
</div>
</body>
</html>
